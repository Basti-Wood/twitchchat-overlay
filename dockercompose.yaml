version: "3"

services:
  twitchchat-overlay:
    build:
      context: .
      dockerfile: DOCKERFILE
    container_name: tuubaa-twitch-chat-overlay
    restart: unless-stopped
    init: true
    ports:
      - "8080:8080"
    volumes:
      - ./conf:/app/conf
      - ./uploads:/app/uploads
    environment:
      - NODE_ENV=production
      - PORT=8080
    networks:
      - tuubaa-network

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/index.html').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  tuubaa-network:
    driver: bridge